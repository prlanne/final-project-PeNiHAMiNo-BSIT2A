<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <title>Admin Login | BentaBoard</title>
    <link rel="preload" href="fonts/poppins-300.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="preload" href="fonts/poppins-400.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="preload" href="fonts/poppins-500.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="preload" href="fonts/poppins-600.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="preload" href="fonts/poppins-700.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css?v=20260513-logo-font" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00a8ff">
    <link rel="apple-touch-icon" href="/img/icons/icon-192.png">
    <link rel="icon" type="image/png" href="/img/icons/icon-192.png"></head>
<body class="auth-overlay">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        
        <div class="auth-card custom-card w-100" style="max-width: 450px;" id="adminLoginFormContainer">
            <!-- Admin Badge -->
            <div class="text-center mb-3">
                <span class="badge bg-danger rounded-pill px-4 py-2 mb-3" style="font-size: 0.8rem; letter-spacing: 1px;">
                    <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i> ADMIN PORTAL
                </span>
            </div>
            
            <div class="text-center mb-4">
                <img src="img/bentaboard.png" alt="BentaBoard Logo" style="width: 70px; height: 70px; margin-bottom: 15px; border-radius: 50%;">
                <h2 class="fw-bold tracking-tight">Admin Login</h2>
                <p class="text-muted small">Access the administration panel</p>
            </div>
            
            <form id="adminLoginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Admin Username</label>
                    <input type="text" class="form-control py-2" name="loginUser" placeholder="Enter admin username" autocomplete="off" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Admin Password</label>
                    <input type="password" class="form-control py-2" name="loginPass" placeholder="Enter admin password" autocomplete="off" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold btn-lift mt-2">Admin Login</button>
            </form>
            
            <div class="text-center mt-4">
                
                <p class="text-muted small mt-2">
                    <a href="role-select.html" class="text-primary fw-bold text-decoration-none">
                        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Back to Role Selection
                    </a>
                </p>
            </div>
        </div>

    </div>

    <script src="js/admin-script.js"></script>
    <script src="/js/pwa-register.js"></script>
    <script src="/js/pwa-install.js"></script></body>
</html>
